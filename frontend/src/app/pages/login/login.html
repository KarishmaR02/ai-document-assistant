<div class="auth-container">
  <div class="glass-card auth-card">
    <div class="auth-header">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <line x1="10" y1="9" x2="8" y2="9"/>
        </svg>
      </div>
      <h2>Welcome Back</h2>
      <p>Sign in to your AI Document Assistant account</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="auth-form">
      <div *ngIf="errorMessage()" class="alert alert-danger">
        {{ errorMessage() }}
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="name@company.com"
          required
          #emailInput="ngModel"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          required
          #passwordInput="ngModel"
        />
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading() || loginForm.invalid">
        <span *ngIf="isLoading()">Signing in...</span>
        <span *ngIf="!isLoading()">Sign In</span>
      </button>
    </form>

    <div class="auth-note">
      <p>Tip: Register first, or use <strong>demo&#64;example.com</strong> / <strong>password</strong></p>
    </div>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register">Create one</a></p>
    </div>
  </div>
</div>
